# Reconstructed. torsocks routes the sandboxed agent's TCP through Tor and
# refuses UDP. AllowOutboundLocalhost 1 is needed so Pi can reach the daemon at
# 127.0.0.1:8787; it also lets every tool reach every other loopback service.
TorAddress 127.0.0.1
TorPort 9050
OnionAddrRange 127.42.42.0/24
AllowOutboundLocalhost 1

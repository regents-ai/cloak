[package]
name = "cloak-near"
version = "0.1.0"
edition = "2021"
publish = false
description = "The guest's check of NEAR AI Cloud's Intel TDX proof, then one chat request encrypted to the checked key (CPU only, no GPU)"

# dcap-qvl checks the Intel quotes, pinned exactly to a version after every
# advisory it has had, with its pure-Rust crypto and without its collateral
# client. chacha20poly1305, curve25519-dalek and hkdf are NEAR's encryption,
# version 2 (curve25519-dalek is the copy dcap-qvl already brings). Every
# other crate is pinned by Cargo.lock, built --locked.
[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
der = { version = "0.8.1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", features = ["serde"] }
hkdf = "0.13.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
webpki-roots = "1"
x509-cert = { version = "0.3.0", default-features = false }

[profile.release]
strip = true
